name: scrape

on:
  # SCHEDULE DISABLED until the repo secrets exist (EBAY_CLIENT_ID/SECRET,
  # DATABASE_URL, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID) — otherwise every timed
  # run fails and emails the owner. Uncomment to go live once secrets are set.
  # schedule:
  #   - cron: "*/20 6-22 * * *"   # every 20 min daytime  (UTC ≈ 07:00–23:59 BST)
  #   - cron: "0 23,0-5 * * *"    # hourly overnight       (UTC)
  workflow_dispatch:            # manual "Run workflow" button

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.main
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
