name: spike
on:
  workflow_dispatch:

jobs:
  ci-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: mkdir -p out && SPIKE_OUT_DIR=out python archive/fb_marketplace/ci_check.py
        env:
          FB_COOKIES: ${{ secrets.FB_COOKIES }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-output
          path: out/
          retention-days: 3
