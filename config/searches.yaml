filters:
  # Backstop for the parts that share a category with whole units (an oven's
  # "element", a dryer's "capacitor"). Only high-confidence part words that almost
  # never appear in a whole-appliance title — deliberately NOT "pump" (heat-pump
  # dryer), "fan" (fan oven), or "spares or repairs" (a whole faulty machine, which
  # is exactly what we want and is a highlight below).
  exclude_keywords:
    # -- individual components / spare parts sharing a whole-appliance category --
    - spare part
    - spares kit
    - spares bundle
    - parts for
    - freezer parts
    - fridge parts
    - element
    - capacitor
    - thermostat
    - sensor
    - terminal
    - hinge
    - latch
    - module
    - circuit board
    - control board
    - programmer
    - cooling fan
    - carbon brush
    - drum paddle
    - door seal
    - kick plate
    - valve
    - hose
    - pan support
    - oven shelf
    - oven rack
    - steam oven shelf
    - egg tray
    - ice box
    - door shelf
    - door tray
    - salad drawer
    - wine rack
    - water container
    - dispenser drawer
    - soap dispenser
    - filter housing
    - casing
    - sump
    - pcb
    - knob
    - wiper blade
    - print advert
    - fridge magnet
    # -- vacuum parts sharing the vacuum category (Dyson especially). NB: do NOT
    #    exclude "motor" (Dyson Motorhead is a whole unit), "animal"/"fluffy"
    #    (model names), or bare "battery"/"filter" (often whole units sold with
    #    accessories). Needs a live tuning pass like the appliance list got. --
    - brush bar
    - brushbar
    - soleplate
    - hepa filter
    - post-motor filter
    - pre-motor filter
    - cyclone assembly
    - wand handle
    - docking station
    # -- novelty / non-white-goods that live in the fridge categories --
    - mini fridge
    - mini-fridge
    - skincare
    - beauty fridge
    - beauty mini
    - makeup
    - cosmetic
    - can cooler
    - drinks cooler
    - wine cooler
    - bottle cooler
    - mini bar
    - thermoelectric
    - cooler and warmer
    - cooler & warmer
    - car fridge
    - coca-cola
    - budweiser
  # Flag (🔧) listings whose title suggests an explicit fault — the repair sweet spot.
  highlight_keywords:
    - spares
    - repair
    - repairs
    - faulty
    - broken
    - not working
    - fault
    - spares or repairs
    - needs
    - leak
    - error
    - no power
