# What to search for and where. Edit freely — the pipeline reloads this each run.

location:
  postcode: "L1 8JQ"    # centre of the collection radius (Liverpool city centre);
                        # also sent to eBay as the buyer location so distances populate
  country: GB
  radius_km: 60         # default search radius; a search can override (null = UK-wide)
  pickup_km: 60         # alerts say "📍 Close by" within this distance (collect by car).
                        # Real km (~37 miles): eBay reports miles, converted in ebay.py.
                        # Before 2026-10 these numbers were silently miles.

marketplace: EBAY_GB

# Auctions are never alerted when first found — only once, when they end within
# this many minutes (checked every 15 min by .github/workflows/auctions.yml).
auction_alert_minutes: 60

# eBay item condition IDs to include:
#   3000 = Used | 7000 = For parts or not working | 1000 New / 
#   1500 New other / 2500 Seller refurbished)
condition_ids: [3000, 2500, 7000]

# Delete listings not seen in this many days (keeps the DB flat; eBay items
# unseen this long are sold/ended).
retention_days: 30

# ============================== HOW TO EDIT ==================================
# Each search is 4 lines. Copy this template, edit, save — next run picks it up:
#
#   - name: "My search"          # label shown in Telegram alerts
#     category_ids: [20614]      # eBay category id(s) — see the list below
#     query: "dyson"             # optional keywords WITHIN the category;
#                                #   spaces = AND: "dyson animal"
#                                #   (a, b)  = OR:  "(dyson v10, dyson v11)"
#     max_price: 90              # GBP cap, applied by eBay server-side
#
# Optional per-search extras:
#     radius_km: null            # override location.radius_km; null = whole UK
#     repair_only: true          # only "For parts or not working", or Used with a
#                                #   fault word (filters.fault_keywords) in the title.
#                                #   Ignores the global condition_ids.
#     premium:                   # higher caps for titles naming these models;
#       - max_price: 200         #   everything else is held to max_price. One or
#         keywords: [oracle]     #   more tiers; if several match, the highest wins.
#       - max_price: 150
#         keywords: [impress]
#
# RULE: always set category_ids — a bare keyword search is ~90% spare parts.
# The category holds whole units; the query refines within it.
#
# Confirmed EBAY_GB category ids:
#   20614  Vacuum Cleaners            133701 Stand Mixers
#   71256  Washing Machines           71257  Washer-Dryers
#   71254  Tumble Dryers              116023 Dishwashers
#   20713  Fridge Freezers            71262  Fridges       71260 Freezers
#   71250  Cookers                    258592 Gas Ranges    71318 Ovens
#   38252  Espresso & Cappuccino Machines     65643  Bean-to-Cup Coffee Machines
#   32882  Coffee Grinders                    156775 Pod & Capsule Coffee Machines
#   159902 Other Coffee, Tea & Espresso Makers
#
# Use LEAF categories only. The coffee parent 38250 ("Coffee, Tea & Espresso
# Makers") contains child 99565 ("Coffee, Tea, Espresso Parts"), so searching the
# parent drags the whole spares aisle in with it.
#
# To find a new category id: ask Claude to probe it, or search the item on
# ebay.co.uk, open a listing, and read the category from the breadcrumb link
# (the number after "/b/" or "_sacat=" in the URL).
# =============================================================================

searches:
  # Broken machines only, UK-wide (far ones need posting — or a message to the
  # seller if they're collection-only). £50 cap, except the premium models.
  - name: "Sage coffee machines (faulty)"
    category_ids: [38252, 65643, 156775, 159902]   # espresso, bean-to-cup, pod, other
    query: "sage"
    max_price: 50                       # Bambino, Duo-Temp, Barista Express, Creatista...
    radius_km: null
    repair_only: true
    premium:
      - max_price: 200
        keywords: [barista pro, barista touch, oracle, dual boiler]
      - max_price: 150                  # working used Impress lists ~£300-370 (Oct 2026)
        keywords: [impress]             # "Barista Touch Impress" still gets the £200 tier

  - name: "Ninja coffee machines (faulty)"
    category_ids: [38252, 65643, 156775, 159902]
    query: "ninja"
    max_price: 50
    radius_km: null
    repair_only: true
    premium:
      - max_price: 200
        keywords: [luxe]                # Ninja Luxe Café


# --- Previous appliance searches (preserved; uncomment to re-enable) ---
  # - name: "Dyson V10+"
  #   category_ids: [20614]               # Vacuum Cleaners
  #   query: "(dyson v10, dyson v11, dyson v12, dyson v13, dyson v14, dyson v15, dyson gen5)"
  #   max_price: 120                      # working V10 resells ~£120-180, V11/V15 more;
  #                                       # cap catches faulty + underpriced units
  # - name: "KitchenAid stand mixers"
  #   category_ids: [133701]              # Stand Mixers (confirmed by live probe)
  #   query: "kitchenaid"
  #   max_price: 200                      # working Artisan resells £200-350; was 150,
  #                                       # raised to catch more of the thin local market

filters:
  # Backstop for the parts that share a category with whole units (an oven's
  # "element", a dryer's "capacitor"). Only high-confidence part words that almost
  # never appear in a whole-appliance title — deliberately NOT "pump" (heat-pump
  # dryer), "fan" (fan oven), or "spares or repairs" (a whole faulty machine, which
  # is exactly what we want and is a highlight below).
  exclude_keywords:
    # -- individual components / spare parts sharing a whole-appliance category --
    - spare part
    - spares kit
    - spares bundle
    - parts for
    - freezer parts
    - fridge parts
    - element
    - capacitor
    - thermostat
    - sensor
    - terminal
    - hinge
    - latch
    - module
    - circuit board
    - control board
    - programmer
    - cooling fan
    - carbon brush
    - drum paddle
    - door seal
    - kick plate
    - valve
    - hose
    - pan support
    - oven shelf
    - oven rack
    - steam oven shelf
    - egg tray
    - ice box
    - door shelf
    - door tray
    - salad drawer
    - wine rack
    - water container
    - dispenser drawer
    - soap dispenser
    - filter housing
    - casing
    - sump
    - pcb
    - knob
    - wiper blade
    - print advert
    - fridge magnet
    # -- vacuum parts sharing the vacuum category (Dyson especially). NB: do NOT
    #    exclude "motor" (Dyson Motorhead is a whole unit), "animal"/"fluffy"
    #    (model names), or bare "battery"/"filter" (often whole units sold with
    #    accessories). Needs a live tuning pass like the appliance list got. --
    - brush bar
    - brushbar
    - motor body
    - bin slider
    - handle housing
    - " part "         # whole word (titles are space-padded, so it matches last word
                        # too): catches "replacement part"/"Case Part Only" without
                        # matching "apart"/"compartment" — or "for parts", which on a
                        # faulty coffee machine means a whole broken unit (keep those)
    - body only
    # -- stand-mixer accessories that share the Stand Mixers category. NB: do NOT
    #    exclude bare "bowl"/"attachment" ("with bowl & attachments" = whole unit
    #    sold complete) — only "-only"/part phrasings. --
    - bowl only
    - dough hook
    - flat beater
    - wire whip
    - whisk only
    - pouring shield
    - splash guard
    - flex edge
    - stand only
    - attachment only
    - attachments only
    - soleplate
    - hepa filter
    - post-motor filter
    - pre-motor filter
    - cyclone assembly
    - wand handle
    - docking station
    # -- coffee-machine / grinder parts sharing the whole-machine categories. The
    #    Bean-to-Cup category (65643) is dominated by one parts reseller ~35km out:
    #    a live probe returned 22 listings there, ALL of them components. NB: do NOT
    #    exclude "milk frother" or "milk jug" (whole units advertise "with milk
    #    frother" / "no milk jug"), "steam wand" ("machine with steam wand"), or
    #    "burr" (grinder model names are "conical burr grinder"). --
    - replacement top
    - top cover
    - brew head
    - shower group
    - shower screen
    - thermocoil
    - thermoblock
    - triac
    - drip tray
    - power cable
    - water tank
    - portafilter
    - tamper
    - cleaning disc
    - descaler
    - descaling
    - bean hopper
    - hopper bean
    - grinder assembly
    - grinder switch
    - display panel
    - wand cleaner
    - grill plate
    - basket only
    - burr set
    - burrs only
    - repair service    # "Diagnostic & Repair Service" — a service, not a machine
    - diagnostic
    - creami            # Ninja Creami ice-cream maker lands in "Other" (159902)
    # -- novelty / non-white-goods that live in the fridge categories --
    - mini fridge
    - mini-fridge
    - skincare
    - beauty fridge
    - beauty mini
    - makeup
    - cosmetic
    - can cooler
    - drinks cooler
    - wine cooler
    - bottle cooler
    - mini bar
    - thermoelectric
    - cooler and warmer
    - cooler & warmer
    - car fridge
    - coca-cola
    - budweiser
  # repair_only searches: a "Used" listing counts as broken if its title has one of
  # these. Also sent to eBay as an OR-group on the Used request, so keep the whole
  # list short — eBay caps the query at 100 chars. Substring match client-side:
  # "fault" covers "faulty", "repair" covers "repairs", "spares" covers "spares or repairs".
  fault_keywords:
    - faulty
    - fault
    - broken
    - spares
    - repair
    - not working
    - no power
    - leaking
  # Flag (🔧) listings whose title suggests an explicit fault (shown in --dry-run).
  highlight_keywords:
    - spares
    - repair
    - repairs
    - faulty
    - broken
    - not working
    - fault
    - spares or repairs
    - needs
    - leak
    - error
    - no power
