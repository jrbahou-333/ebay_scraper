# What to search for and where. Edit freely — the pipeline reloads this each run.

location:
  postcode: "L1 8JQ"    # centre of the collection radius (Liverpool city centre);
                        # also sent to eBay as the buyer location so distances populate
  country: GB
  radius_km: 25         # ~30 min drive; enforced client-side (eBay ignores its own radius filter)

marketplace: EBAY_GB

# eBay item condition IDs to include:
#   3000 = Used
#   7000 = For parts or not working
# (1000 New / 1500 New other / 2500 Seller refurbished are deliberately excluded)
condition_ids: [3000, 7000]

# Delete listings not seen in this many days (keeps the DB flat; eBay items
# unseen this long are sold/ended).
retention_days: 30

# Searches are driven by eBay CATEGORY, not keywords: a bare keyword search is
# ~90% spare parts, whereas the category holds whole units. A `query` refines
# within the category (ANDed). max_price is GBP.
#
# 20614 = "Vacuum Cleaners" (confirmed via eBay UK browse URLs). Vacuum *parts*
# live in a separate category, so category-scoping keeps whole units — the same
# win as the appliance searches. One live run is still wanted to tune the vacuum
# exclude_keywords (below), as we did for appliances.
searches:
  - name: "Dyson vacuums"
    category_ids: [20614]               # Vacuum Cleaners
    query: "dyson"
    max_price: 90                       # faulty/cheap cordless flip range; working ones sell £120+
  - name: "Hoover & other vacuums"
    category_ids: [20614]               # Vacuum Cleaners
    query: "hoover"
    max_price: 45

